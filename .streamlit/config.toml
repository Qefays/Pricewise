[theme]
base = "light"
primaryColor = "#087f70"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6f5"
textColor = "#182d2a"
font = "Segoe UI"
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
headingFont = "Segoe UI"
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["2.1rem", "1.5rem", "1.12rem", "1rem", "1rem", "1rem"]
showSidebarBorder = false
dataframeHeaderBackgroundColor = "#edf3ef"
showWidgetBorder = true
borderColor = "#dce6df"
chartCategoricalColors = ["#158477", "#d49a42", "#4e77a5", "#a36e8b"]

[theme.sidebar]
backgroundColor = "#123b34"
secondaryBackgroundColor = "#204e45"
textColor = "#f0f6f2"
primaryColor = "#77d3b0"
borderColor = "#346156"
